<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Product Explorer</title>
    <link rel="stylesheet" href="Q2_products.css">
</head>
<body>

    <h1>Product Explorer</h1>

    <!-- Loading message element -->
    <div id="loading" class="message">Loading products... Please wait.</div>

    <!-- Error message element (hidden by default) -->
    <div id="error" class="message error-message" style="display: none;"></div>

    <!-- Container where product cards will be displayed -->
    <div id="product-container" class="container"></div>

    <script src="Q2_products.js"></script>
</body>
</html>
