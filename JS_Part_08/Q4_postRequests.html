<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Practice - Announcements</title>
  <!-- Link to the separate external CSS file -->
  <link rel="stylesheet" href="Q4_postRequests.css">
</head>
<body>

  <h2>Submit an Announcement</h2>
  
  <!-- Form fields requested by the prompt -->
  <form id="announcementForm">
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" id="title" value="New Feature Update" required>
    </div>
    
    <div class="form-group">
      <label for="content">Content (Body):</label>
      <textarea id="content" rows="4" required>We have added markdown support to the assignment portal!</textarea>
    </div>
    
    <div class="form-group">
      <label for="userId">User ID:</label>
      <input type="number" id="userId" value="1" required>
    </div>

    <!-- Interactive action buttons -->
    <button type="submit">1. Send POST (Create)</button>
    <button type="button" id="btnPut">2. Send PUT (Replace /posts/1)</button>
    <button type="button" id="btnPatch">3. Send PATCH (Update Title /posts/1)</button>
    <button type="button" id="btnDelete">4. Send DELETE (/posts/1)</button>
  </form>

  <h3>API Response Output:</h3>
  <div id="output">Click a button or submit the form to see API logs...</div>

  <!-- Link to the separate external JavaScript file -->
  <script src="Q4_postRequests.js"></script>
</body>
</html>
