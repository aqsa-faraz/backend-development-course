<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="switch-statement.js" defer></script>
    <style>
        table{
            border-collapse: collapse;
            width: 80%;
            text-align: center;
            margin: 20px;
            justify-self: center;

        }
        th{
            border: 1px solid #dddddd;
            background-color: rgb(6, 6, 116);
            color: #fff;
            padding: 10px;
        }
        td{
            border: 1px solid #dddddd;
            padding: 8px;
        }
        tr:nth-child(odd){
            background-color: #dddddd
        }
    </style>
    <title>Menu Selection</title>
</head>
<body>
    <h1 style="text-align: center;">Menu Selection Using 'switch'</h1>

    <table>
        <tr>
            <th>Choice</th>
            <th>Option</th>
            <th>Output</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Home</td>
            <td>You selected Home</td>
        </tr>
        <tr>
            <td>2</td>
            <td>About</td>
            <td>You selected About</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Services</td>
            <td>You selected Services</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Contact</td>
            <td>You selected Contact</td>
        </tr>
    </table>

    <h3>Choice: <em id="choice_made"></em></h3>
    <h3>You selected <em id="option_selected"></em></h3>
</body>
</html>
