<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registration.css">
    <title>Student Registration Form</title>
</head>

<body>

    <div class="form-container">
        <h2>REGISTATION FORM</h2>
        <form action="">
            <!-- full name -->
            <div class="input-class">
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="input-class">
                <!-- email -->
                <label for="email">Enter your email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-class">
                <!-- password -->
                <label for="pwd">Password:</label>
                <input type="password" id="pwd" name="pwd" required>
            </div>
            <div class="input-class">
                <!-- date of birth -->
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>
            <div class="input-row">
                <!-- gender -->
                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="Male">
                <label for="female">Female</label>
            </div>
            <div>
                <!-- fav programming language -->
                <p>Choose your favorite programming language:</p>
                <div class="input-row">
                    <input type="checkbox" name="fav_language" id="javascript" value="JavaScript">
                    <label for="javascript">JavaScript</label>
                    <input type="checkbox" name="fav_language" id="python" value="Python">
                    <label for="python">Python</label>
                    <input type="checkbox" name="fav_language" id="java" value="Java">
                    <label for="java">Java</label>
                </div>

            </div>
            <div class="input-row">
                <!-- city -->
                <label for="city">Choose a city:</label>
                <select id="city" name="city">
                    <option value="">--Please choose a city--</option>
                    <option value="karachi">Karachi</option>
                    <option value="lahore">Lahore</option>
                    <option value="islamabad">Islamabad</option>
                    <option value="peshawar">Peshawar</option>
                </select>
            </div>
            <div class="input-class">
                <!-- about yourself -->
                <label for="about_yourself">About Yourself:</label>
                <textarea name="about_yourself" id="about_yourself"></textarea>
            </div>

            <div class="buttons">
                <!-- submit -->
                <!-- <input type="submit" value="Submit"> -->
                <button type="submit" class="btn">Submit</button>
                <!-- reset -->
                <button type="reset" class="btn">Reset</button>
                <!-- <input type="reset" value="Reset"> -->
            </div>

        </form>
    </div>

</body>

</html>
