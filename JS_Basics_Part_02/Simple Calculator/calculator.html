<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <title>Simple Calculator</title>
</head>

<body>
    <h3>simple calculator</h3>
    <div class="calculator">
        <div class="operands">
            <input type="number" name="" id="operand1">
            <input type="number" name="" id="operand2">
        </div>
        <div class="operators">
            <input type="button" value="+" class="btn" id="add">
            <input type="button" value="-" class="btn" id="sub">
            <input type="button" value="*" class="btn" id="multiply">
            <input type="button" value="/" class="btn" id="divide">
        </div>
        <p>Result: <span id="result"></span> </p>
    </div>

    <script src="calculator.js"></script>

</body>

</html>
